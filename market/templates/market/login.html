{% extends "market/base.html" %}
{% block title %}Login — Mud2Meal{% endblock %}

{% block extra_head %}
<style>
    .auth-page {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .auth-wrap {
        width: 100%;
        max-width: 440px;
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        padding: 44px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .auth-logo {
        text-align: center;
        font-size: 32px;
        font-weight: 900;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #f7971e, #ffd200);
        -webkit-background-clip: text;
        background-clip: text;  
        -webkit-text-fill-color: transparent;
    }

    .auth-logo span {
        background: linear-gradient(135deg, #56ab2f, #a8e063);
        -webkit-background-clip: text;
        background-clip: text;  
        -webkit-text-fill-color: transparent;
    }

    .auth-title {
        font-size: 22px;
        font-weight: bold;
        color: #fff;
        text-align: center;
        margin-bottom: 6px;
        margin-top: 20px;
    }

    .auth-subtitle {
        color: #666;
        text-align: center;
        font-size: 14px;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        color: #888;
        font-size: 13px;
        margin-bottom: 8px;
        font-weight: 500;
    }

    .form-group input {
        width: 100%;
        padding: 13px 16px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        color: #fff;
        font-size: 14px;
        outline: none;
        transition: border 0.2s;
    }

    .form-group input:focus {
        border-color: #f7971e;
    }

    .btn-submit {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #f7971e, #ffd200);
        color: #000;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: opacity 0.2s;
        margin-top: 8px;
    }

    .btn-submit:hover { opacity: 0.9; }

    .auth-footer {
        text-align: center;
        margin-top: 24px;
        color: #666;
        font-size: 14px;
    }

    .auth-footer a {
        color: #f7971e;
        text-decoration: none;
        font-weight: 500;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 20px 0;
        color: #444;
        font-size: 13px;
    }

    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(255,255,255,0.08);
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-wrap">
        <div class="auth-logo">M<span>2</span>Meal</div>
        <div class="auth-title">Welcome Back 👋</div>
        <div class="auth-subtitle">Login to your account</div>


        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username"
                       placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">
                Login →
            </button>
        </form>

        <div class="divider">or</div>

        <div class="auth-footer">
            Don't have an account?
            <a href="/register/">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
