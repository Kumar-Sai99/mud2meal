{% extends 'market/base.html' %}
{% block title %}Login — Mud2Meal{% endblock %}
{% block extra_head %}
<style>
.auth-wrap{max-width:440px;margin:60px auto}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:44px}
.auth-logo{font-family:var(--serif);font-size:30px;color:var(--text);text-align:center;margin-bottom:6px}
.auth-logo em{color:var(--gold);font-style:italic}
.auth-sub{text-align:center;color:var(--text2);font-size:14.5px;margin-bottom:34px}
.auth-footer{text-align:center;margin-top:22px;font-size:14px;color:var(--text3)}
.auth-footer a{color:var(--gold);text-decoration:none;font-weight:600}
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Mud<em>2</em>Meal</div>
    <div class="auth-sub">Welcome back! Sign in to continue.</div>

    <form method="post">
      {% csrf_token %}
      <div class="fg"><label class="lbl">Username</label><input type="text" name="username" class="fc" placeholder="Your username" required autofocus></div>
      <div class="fg"><label class="lbl">Password</label><input type="password" name="password" class="fc" placeholder="Your password" required></div>
      <button type="submit" class="btn btn-gold" style="width:100%;justify-content:center;padding:13px;margin-top:8px">Sign In →</button>
    </form>

    <div style="height:1px;background:var(--border);margin:24px 0"></div>
    <div class="auth-footer">Don't have an account? <a href="{% url 'role_select' %}">Join free</a></div>
  </div>
</div>
{% endblock %}
